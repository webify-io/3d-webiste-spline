<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Webify App</title>
    <link rel="stylesheet" href="style.css" />
    <!-- AOS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
  </head>
  <body>
    <img class="image-gradient" src="/assets/gradient.png" alt="gradient" />
    <div class="layer-blur"></div>

    <div class="container">
      <header>
        <h1 class="logo" data-aos="fade-down" data-aos-duration="1500">
          WEBIFY
        </h1>

        <nav>
          <a href="#" data-aos="fade-down" data-aos-duration="1500">COMPANY</a>
          <a href="#" data-aos="fade-down" data-aos-duration="2000">FEATURES</a>
          <a href="#" data-aos="fade-down" data-aos-duration="2500"
            >RESOURCES</a
          >
          <a href="#" data-aos="fade-down" data-aos-duration="3000">DOCS</a>
        </nav>

        <button
          class="btn-signin"
          data-aos="fade-down"
          data-aos-duration="1500"
        >
          LOGIN
        </button>
      </header>

      <main>
        <div class="content">
          <div
            class="tag-box"
            data-aos="fade-zoom-in"
            data-aos-easing="ease-in-back"
            data-aos-delay="300"
            data-aos-offset="0"
            data-aos-duration="1500"
          >
            <div class="tag">INTRODUCING &wedbar;</div>
          </div>

          <h1
            data-aos="fade-zoom-in"
            data-aos-easing="ease-in-back"
            data-aos-delay="300"
            data-aos-offset="0"
            data-aos-duration="2000"
          >
            EMAIL FOR <br />DEVELOPERS
          </h1>

          <p
            class="description"
            data-aos="fade-zoom-in"
            data-aos-easing="ease-in-back"
            data-aos-delay="300"
            data-aos-offset="0"
            data-aos-duration="2500"
          >
            The best way to reach us for all your web development needs is thru
            our website and socials, conveniently linked for you right here!
          </p>

          <div
            class="buttons"
            data-aos="fade-zoom-in"
            data-aos-easing="ease-in-back"
            data-aos-delay="300"
            data-aos-offset="0"
            data-aos-duration="3000"
          >
            <a href="#" class="btn-get-started">Documentation &gt;</a>
            <a href="#" class="btn-signin-main">Get Started &gt;</a>
          </div>
        </div>
      </main>

      <spline-viewer
        class="robot-3d"
        data-aos="fade-zoom-in"
        data-aos-easing="ease-in-back"
        data-aos-delay="300"
        data-aos-offset="0"
        data-aos-duration="3000"
        url="https://prod.spline.design/0tnV-qse41NNipN3/scene.splinecode"
      ></spline-viewer>
    </div>

    <script
      type="module"
      src="https://unpkg.com/@splinetool/viewer@1.9.89/build/spline-viewer.js"
    ></script>

    <!-- AOS Script -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
      AOS.init();
    </script>
  </body>
</html>
